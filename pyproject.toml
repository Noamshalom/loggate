[project]
name = "loggate"
version = "0.1.0"
description = "A self-training gatekeeper that decides which log sessions an LLM should see"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loggate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
